<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Installable from the Quest Browser, so coming back is one tap in the library. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#23272e" />
    <title>SpinSmith</title>
    <style>
      @font-face {
        font-family: Rajdhani;
        font-weight: 700;
        src: url('./fonts/Rajdhani-Bold.woff2') format('woff2');
      }
      @font-face {
        font-family: Rajdhani;
        font-weight: 600;
        src: url('./fonts/Rajdhani-SemiBold.woff2') format('woff2');
      }
      body { margin: 0; background: #16191e; }
      #landing {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 22px; padding: 24px; box-sizing: border-box; text-align: center;
        color: #eef3fa; font-family: Rajdhani, system-ui, sans-serif;
        background: radial-gradient(circle at 50% 38%, #2c3139 0%, #16191e 70%);
      }
      #landing.hidden { display: none; }
      #landing img { width: 112px; height: 112px; border-radius: 22px; }
      #landing h1 { margin: 0; font-size: 56px; font-weight: 700; letter-spacing: 12px; }
      #landing h1::after { content: ''; display: block; width: 40%; height: 4px; margin: 10px auto 0; background: #ff8a2a; }
      #landing p { margin: 0; max-width: 560px; font-size: 22px; font-weight: 600; color: #c9d3e0; }
      #landing ul { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin: 0; padding: 0; list-style: none; }
      #landing li { padding: 10px 16px; border: 1px solid #4a5566; border-radius: 6px; background: #23272e; font-size: 19px; font-weight: 600; }
      #enter {
        margin-top: 8px; padding: 14px 54px; border: 0; border-radius: 6px; background: #ff8a2a; color: #16191e;
        font-family: inherit; font-size: 28px; font-weight: 700; letter-spacing: 4px; cursor: pointer;
      }
      #enter:hover { background: #ffb347; }
    </style>
  </head>
  <body>
    <div id="landing">
      <img src="./icons/icon-192.png" alt="" />
      <h1>SPINSMITH</h1>
      <p>Forge a spinning top by hand, rip it into your real table, then reshape the arena mid-fight to win.</p>
      <ul>
        <li>Sit at a table</li>
        <li>Hands only, no controllers</li>
        <li>Allow spatial data for your table</li>
      </ul>
      <button id="enter" type="button">ENTER</button>
    </div>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
